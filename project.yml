# XcodeGen spec — generates MacPulse.xcodeproj (git-ignored).
#   brew install xcodegen
#   xcodegen generate
#   open MacPulse.xcodeproj
name: MacPulse

options:
  bundleIdPrefix: com.mrismail
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  MacPulse:
    path: .

targets:
  MacPulse:
    type: application
    platform: macOS
    sources:
      - path: App/MacPulseApp
        excludes:
          - Resources
      # Icon, privacy manifest and String Catalog.
      - path: App/MacPulseApp/Resources
        buildPhase: resources
    dependencies:
      - package: MacPulse
        product: MacPulseAppCore
    info:
      path: App/MacPulseApp/Info.plist
      properties:
        CFBundleDisplayName: MacPulse
        # Set in settings below; scripts/release/bump-version.sh changes the version and
        # release builds pass the build number (git commit count).
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
    # ADR-010: no App Sandbox (direct distribution, Developer ID + notarization).
    # No entitlements at all; add one only with an ADR.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrismail.MacPulse
        PRODUCT_NAME: MacPulse
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # Ad-hoc signing for local development and CI. Set DEVELOPMENT_TEAM and
        # CODE_SIGN_STYLE: Automatic once an Apple Developer account is configured.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          # No get-task-allow (debugger attach) in shipping builds; notarization rejects it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    scheme:
      gatherCoverageData: false
      testTargets:
        - MacPulseUITests

  # UI automation (XCUITest). Launches the app with -MacPulseUseFakeServices so
  # results do not depend on the test machine's battery or disks.
  MacPulseUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/UIAutomationTests
    dependencies:
      - target: MacPulse
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrismail.MacPulseUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MacPulse
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
