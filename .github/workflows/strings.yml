name: Strings

# The String Catalog is generated from the compiler's extracted strings, never edited by
# hand for English. On a pull request from this repository, an out-of-date catalog is
# synced and committed back to the branch; on main, it must already be in sync.
# Pushes made with GITHUB_TOKEN start no workflows, so after committing, the job starts CI
# for the new commit itself (workflow_dispatch), and the PR's checks cover it.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: String Catalog in sync
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write  # commit the synced catalog to a same-repository PR branch
      actions: write   # start CI for that commit
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # The PR branch itself for same-repository PRs (so the bot can commit to it);
          # the merge commit otherwise (fork PRs: check only).
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || github.sha }}
          persist-credentials: false

      - name: Install XcodeGen
        run: scripts/ci/install-xcodegen.sh

      - name: Sync the String Catalog
        run: scripts/sync-strings.sh | tee strings.txt

      - name: Commit or check
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          CATALOG=App/MacPulseApp/Resources/Localizable.xcstrings
          echo "::notice title=String Catalog::$(tail -1 strings.txt)"
          if git diff --quiet -- "$CATALOG"; then
            echo "Catalog is in sync"; exit 0
          fi
          if [ "${{ github.event_name }}" = pull_request ] && [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$CATALOG"
            git commit -m "Sync the String Catalog with the source strings"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${HEAD_REF}"
            gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$HEAD_REF"
            echo "::notice::String Catalog updated and committed to the branch; CI started for that commit"
          else
            echo "::error::Localizable.xcstrings is out of date; run scripts/sync-strings.sh on a Mac"
            git diff --stat
            exit 1
          fi
