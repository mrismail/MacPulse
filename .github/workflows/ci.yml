name: CI

on:
  # PR branches are covered by the pull_request event; running on push as well would
  # double the (paid) macOS minutes for every PR commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Every pushed batch is verified (not cancelled by the next push), so no commit on a
  # PR reaches main unchecked. Batches queue instead.
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build, test and launch
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the build number is the commit count

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build package (warnings are errors)
        run: |
          set -o pipefail
          if ! swift build -Xswiftc -warnings-as-errors 2>&1 | tee build.log; then
            # Logs can't always be downloaded; surface compiler errors as annotations.
            grep -E 'error:' build.log | sort -u | head -30 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Run unit and integration tests
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee swift-test.log | tail -20 || {
            # Surface failing tests as annotations so they are readable without the raw log.
            grep -E "✘|error:|Expectation failed|failed after" swift-test.log | sort -u | head -40 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app and run UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project MacPulse.xcodeproj \
            -scheme MacPulse \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath build/UITests.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test 2>&1 | tee xcodebuild.log | grep -E "(warning|error):|Test Case|\*\* TEST" \
            || {
              echo "::error::xcodebuild test failed"
              # Surface the failing lines as annotations so they are readable without the raw log.
              grep -E "error:|failed|XCTAssert|Failing tests|Testing failed" xcodebuild.log \
                | grep -v "^Test Suite" | sort -u | head -40 \
                | while IFS= read -r line; do echo "::error::${line:0:900}"; done
              exit 1
            }
          test -d build/Build/Products/Debug/MacPulse.app
          # The contrast audit is non-blocking (DEFERRED.md); show any findings xcodebuild
          # prints. UI-test stdout doesn't reach this log, so no line is not proof of none.
          grep -oE "Contrast: .{0,800}" xcodebuild.log | sort -u | head -5 \
            | while IFS= read -r line; do echo "::notice::${line}"; done || true

      - name: Smoke test — app launches and stays running (English and Arabic)
        # Also after failed UI tests, so a launch problem is diagnosed in the same run.
        if: ${{ !cancelled() && hashFiles('build/Build/Products/Debug/MacPulse.app/Contents/Info.plist') != '' }}
        run: |
          APP=build/Build/Products/Debug/MacPulse.app/Contents/MacOS/MacPulse
          for LANG_ARGS in "" "-AppleLanguages (ar) -AppleLocale ar_EG" "-MacPulseUseFakeServices -AppleLanguages (ar) -AppleLocale ar_EG"; do
            # shellcheck disable=SC2086
            "$APP" $LANG_ARGS > smoke.log 2>&1 &
            PID=$!
            sleep 10
            if kill -0 "$PID" 2>/dev/null; then
              echo "MacPulse is running (pid $PID) ${LANG_ARGS:-English}"
              if [ -n "$LANG_ARGS" ]; then
                # Show what the main thread is doing (diagnoses a launch without a window).
                sample "$PID" 2 -file sample.txt >/dev/null 2>&1 || true
                WINDOWS=$(osascript -e 'tell application "System Events" to count windows of (first process whose unix id is '"$PID"')' 2>&1 || true)
                echo "::notice title=Launch $LANG_ARGS::windows: $WINDOWS"
                awk '/Thread_.*DispatchQueue_1: com.apple.main-thread/{f=1} f{print; n++} n>45{exit}' sample.txt \
                  | grep -vE '^\s*$' | head -45 | while IFS= read -r l; do echo "::notice title=Main thread::${l:0:300}"; done
              fi
              kill "$PID"; wait "$PID" 2>/dev/null || true
            else
              wait "$PID"; STATUS=$?
              echo "::error::MacPulse exited early with status $STATUS (${LANG_ARGS:-English})"
              tail -20 smoke.log | while IFS= read -r l; do echo "::error::${l:0:500}"; done
              exit 1
            fi
          done

      - name: Build Release configuration
        run: |
          set -o pipefail
          xcodebuild -project MacPulse.xcodeproj -scheme MacPulse -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build-release \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build 2>&1 | tee release.log | tail -5 \
            || { grep -E "error:" release.log | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l:0:900}"; done; exit 1; }

      - name: Verify Release bundle (version, icon, privacy manifest)
        run: |
          python3 - <<'PY'
          import plistlib, re, subprocess, sys, os
          app = "build-release/Build/Products/Release/MacPulse.app/Contents"
          info = plistlib.load(open(f"{app}/Info.plist", "rb"))
          expected = re.search(r'MARKETING_VERSION: "([0-9.]+)"', open("project.yml").read()).group(1)
          count = subprocess.check_output(["git", "rev-list", "--count", "HEAD"], text=True).strip()
          version, build = info.get("CFBundleShortVersionString"), info.get("CFBundleVersion")
          print(f"::notice title=Release version::{version} ({build})")
          errors = []
          if version != expected: errors.append(f"version {version}, expected {expected}")
          if build != count: errors.append(f"build {build}, expected the commit count {count}")
          if info.get("CFBundleIconName") != "AppIcon": errors.append("CFBundleIconName is not AppIcon")
          for name in ("Assets.car", "AppIcon.icns", "PrivacyInfo.xcprivacy"):
              if not os.path.exists(f"{app}/Resources/{name}"): errors.append(f"missing Resources/{name}")
          if os.path.exists(f"{app}/Resources/PrivacyInfo.xcprivacy"):
              manifest = plistlib.load(open(f"{app}/Resources/PrivacyInfo.xcprivacy", "rb"))
              if manifest.get("NSPrivacyTracking") is not False or manifest.get("NSPrivacyCollectedDataTypes") != []:
                  errors.append("privacy manifest must declare no tracking and no collected data")
          for e in errors: print(f"::error::{e}")
          sys.exit(1 if errors else 0)
          PY

      - name: Verify Release signing (no entitlements, Hardened Runtime)
        run: |
          codesign -d --entitlements - --xml build-release/Build/Products/Release/MacPulse.app > entitlements.plist
          # Checked on Release, the shipping artifact: Xcode adds debugging/preview
          # exceptions to Debug builds automatically. Anything new here needs an ADR first.
          python3 - <<'PY'
          import plistlib, sys
          with open("entitlements.plist", "rb") as f:
              data = f.read()
          entitlements = plistlib.loads(data) if data.strip() else {}
          print(f"::notice::Release entitlements: {entitlements}")
          allowed = {}  # ADR-010: no entitlements; any new one needs an ADR
          if entitlements != allowed:
              print(f"::error::Expected exactly {allowed}, got {entitlements}")
              sys.exit(1)
          PY
          codesign -dv --verbose=4 build-release/Build/Products/Release/MacPulse.app 2>&1 | tee codesign.txt
          grep -Eq "flags=.*runtime" codesign.txt || { echo "::error::Hardened Runtime is not enabled"; exit 1; }

      - name: Process-access probe (ADR-009/010) — must keep working
        run: |
          for config in Release Debug; do
            if [ "$config" = Release ]; then APP=build-release/Build/Products/Release/MacPulse.app; else APP=build/Build/Products/Debug/MacPulse.app; fi
            LINE=$(MACPULSE_DIAGNOSTICS=1 "$APP/Contents/MacOS/MacPulse" --macpulse-process-access-probe | grep '^MACPULSE_PROCESS_PROBE ')
            JSON=${LINE#MACPULSE_PROCESS_PROBE }
            echo "::notice title=Process probe ($config)::$JSON"
            echo "$JSON" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          ok = r["anyProcessRusage"]["succeeded"]
          sandboxed = r["isSandboxed"]
          if sandboxed or ok == 0:
              print("::error::Process monitoring regressed: sandboxed=%s, rusage ok=%s" % (sandboxed, ok))
              sys.exit(1)
          '
          done
          # Without the environment variable the probe must not run (normal launches).
          OUT=$(mktemp)
          build-release/Build/Products/Release/MacPulse.app/Contents/MacOS/MacPulse --macpulse-process-access-probe > "$OUT" 2>/dev/null &
          PID=$!
          sleep 5
          kill "$PID" 2>/dev/null || true
          if grep -q MACPULSE_PROCESS_PROBE "$OUT"; then
            echo "::error::Diagnostics ran without MACPULSE_DIAGNOSTICS=1"; exit 1
          fi

      - name: Monitoring overhead budget (Phase 3 acceptance)
        run: |
          LINE=$(MACPULSE_DIAGNOSTICS=1 build-release/Build/Products/Release/MacPulse.app/Contents/MacOS/MacPulse --macpulse-overhead-benchmark | grep '^MACPULSE_OVERHEAD ')
          JSON=${LINE#MACPULSE_OVERHEAD }
          echo "::notice title=Monitoring overhead (Release, CI VM)::$JSON"
          echo "$JSON" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          ms = r["cpuMillisecondsPerSample"]
          processes = max(1, r["processCount"])
          per_process = ms / processes
          # Budget per process read, so Macs with more processes are not held to the VM
          # total: 0.03 ms per process, about 2x the CI VM (0.007-0.016) so a regression shows; the
          # owner Intel MacBook Pro measured 0.025 and is checked by hand.
          # Also a hard ceiling: 0.1 % of one core at the 60 s background rate.
          if per_process > 0.03:
              print("::error::Monitoring costs %.3f ms CPU per process per sample (budget 0.03 ms)" % per_process)
              sys.exit(1)
          if r["cpuPercentAtBackgroundRate"] > 0.1:
              print("::error::Monitoring uses %.3f%% of a core in the background (budget 0.1%%)" % r["cpuPercentAtBackgroundRate"])
              sys.exit(1)
          '

      - name: Scan budget (Phase 4 acceptance, ADR-013)
        run: |
          LINE=$(MACPULSE_DIAGNOSTICS=1 MACPULSE_SCAN_FILES=200000 build-release/Build/Products/Release/MacPulse.app/Contents/MacOS/MacPulse --macpulse-scan-benchmark | grep '^MACPULSE_SCAN_BENCHMARK ')
          JSON=${LINE#MACPULSE_SCAN_BENCHMARK }
          echo "::notice title=Scan benchmark (Release, CI VM)::$JSON"
          echo "$JSON" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          errors = []
          if not r["resultIsComplete"]:
              errors.append("the scan missed files (%d items scanned)" % r["itemsScanned"])
          # The UI must stay responsive: the main thread never stalls more than 250 ms.
          if r["maxMainThreadStallMilliseconds"] > 250:
              errors.append("main thread stalled %.0f ms (budget 250 ms)" % r["maxMainThreadStallMilliseconds"])
          # Memory stays bounded: 200,000 files in under 150 MB peak footprint (measured 75 MB).
          if r["peakFootprintBytes"] > 150 * 1000 * 1000:
              errors.append("peak memory %.0f MB (budget 150 MB)" % (r["peakFootprintBytes"] / 1e6))
          if r["secondsToScan"] > 120:
              errors.append("scan took %.0f s (budget 120 s)" % r["secondsToScan"])
          for e in errors:
              print("::error::Scan benchmark: " + e)
          sys.exit(1 if errors else 0)
          '

      - name: Duplicate search budget (Phase 5 acceptance, ADR-014)
        run: |
          LINE=$(MACPULSE_DIAGNOSTICS=1 build-release/Build/Products/Release/MacPulse.app/Contents/MacOS/MacPulse --macpulse-duplicate-benchmark | grep '^MACPULSE_DUPLICATE_BENCHMARK ')
          JSON=${LINE#MACPULSE_DUPLICATE_BENCHMARK }
          echo "::notice title=Duplicate benchmark (Release, CI VM)::$JSON"
          echo "$JSON" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          errors = []
          if r["lookAlikesGrouped"] != 0:
              errors.append("%d groups contain files that differ in content" % r["lookAlikesGrouped"])
          if not r["resultIsCorrect"]:
              errors.append("found %d groups (expected %d), largest %d (expected 100)" % (r["groupsFound"], r["groupsExpected"], r["largestGroup"]))
          if r["maxMainThreadStallMilliseconds"] > 250:
              errors.append("main thread stalled %.0f ms (budget 250 ms)" % r["maxMainThreadStallMilliseconds"])
          # Measured 41 MB while reading 1.9 GB; reads are drained per file.
          if r["peakFootprintBytes"] > 100 * 1000 * 1000:
              errors.append("peak memory %.0f MB (budget 100 MB)" % (r["peakFootprintBytes"] / 1e6))
          if r["secondsToSearch"] > 180:
              errors.append("search took %.0f s (budget 180 s)" % r["secondsToSearch"])
          for e in errors:
              print("::error::Duplicate benchmark: " + e)
          sys.exit(1 if errors else 0)
          '

      - name: Guardrails — no networking, no process control (ADR-010)
        run: |
          # Source: APIs MacPulse must never use without a new ADR.
          if grep -RInE '\b(URLSession|NWConnection|NWListener|import Network|task_for_pid|kill *\(|AuthorizationExecuteWithPrivileges|SMJobBless|NSAppleScript|NSClassFromString|sel_registerName|dlsym|dlopen|NSWorkspace\.shared\.open\b|openFile\b|openURLs|openApplication)|Selector\(\(' \
               --include='*.swift' App Domain Features Infrastructure Shared; then
            echo "::error::Forbidden API found in sources (see ADR-010)"; exit 1
          fi
          # User items leave their place only through the Trash service (ADR-015). Other
          # file-changing APIs are limited to MacPulse's own data stores and the
          # benchmarks' temporary trees. Nothing deletes user files permanently.
          if grep -RInE '\btrashItem|\brecycle\b|trashItemAtURL|NSSelectorFromString|Selector\("' \
               --include='*.swift' App Domain Features Infrastructure Shared \
               | grep -vE '^[^:]+:[0-9]+: *//' \
               | grep -vE '^Infrastructure/Cleanup/FileManagerTrashService\.swift:[0-9]+: *try FileManager\.default\.trashItem\(at: URL\(fileURLWithPath: candidate\.path\), resultingItemURL: &resulting\)'; then
            echo "::error::Trash or dynamic-selector API outside the one allowed call (see ADR-015)"; exit 1
          fi
          ALLOWED='^(Infrastructure/Persistence/(DailyJSONLinesFiles|JSONLinesBatteryHistoryStore)\.swift|Infrastructure/Storage/ScanBenchmark\.swift|Infrastructure/Duplicates/DuplicateBenchmark\.swift):'
          if grep -RInE '\b(removeItem|moveItem|replaceItem|replaceItemAt|copyItem|linkItem|createSymbolicLink|unlink|unlinkat|rmdir|removefile|renameat|renamex_np|renameatx_np|truncate|ftruncate|copyfile|clonefile|exchangedata)\(|(^|[^.[:alnum:]_])(remove|rename)\(' \
               --include='*.swift' App Domain Features Infrastructure Shared \
               | grep -vE '^[^:]+:[0-9]+: *//' \
               | grep -vE "$ALLOWED" \
               | grep -vE '^Infrastructure/Cleanup/FileManagerTrashService\.swift:[0-9]+: *try FileManager\.default\.moveItem\(atPath: trash, toPath: original\)'; then
            echo "::error::File-changing API outside the allowed files (see ADR-013/015/016)"; exit 1
          fi
          # Module-qualified C calls (Darwin.remove) and APIs that overwrite or rename
          # files are limited to the same files.
          if grep -RInE '\b(Darwin|Foundation|Glibc)\.(remove|rename|unlink|rmdir|truncate)\(|\bcreateFile\(|FileHandle\(for(Writing|Updating)|\bO_(TRUNC|WRONLY|RDWR)\b|\.write\(to(File)?:|setResourceValues' \
               --include='*.swift' App Domain Features Infrastructure Shared \
               | grep -vE '^[^:]+:[0-9]+: *//' \
               | grep -vE "$ALLOWED"; then
            echo "::error::File-writing API outside the allowed files (see ADR-013/015/016)"; exit 1
          fi
          # No running other programs (an rm or osascript would bypass every rule above).
          if grep -RInE '\b(Process\(|NSTask|posix_spawn|execv|execve|popen\(|launchApplication|openApplication)|(^|[^.[:alnum:]_])system\(' \
               --include='*.swift' App Domain Features Infrastructure Shared | grep -vE '^[^:]+:[0-9]+: *//'; then
            echo "::error::Running other programs isn't allowed (see ADR-010)"; exit 1
          fi
          # Binary: no direct references to socket, process-control, spawning or unlink symbols.
          BIN=build-release/Build/Products/Release/MacPulse.app/Contents/MacOS/MacPulse
          if nm -u "$BIN" | grep -E '^_(socket|connect|task_for_pid|kill|ptrace|posix_spawn|posix_spawnp|execve|execv|execvp|system|popen|fork|vfork|unlink|unlinkat|rmdir|remove|removefile|rename|renameat|renamex_np|renameatx_np|exchangedata|truncate|dlopen|dlsym|NSClassFromString|sel_registerName)$'; then
            echo "::error::Forbidden symbol linked in the Release binary (see ADR-010/015)"; exit 1
          fi
          echo "Guardrails OK"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            build/UITests.xcresult
          if-no-files-found: ignore
