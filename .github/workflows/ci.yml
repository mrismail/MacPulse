name: CI

on:
  # PR branches are covered by the pull_request event; running on push as well would
  # double the (paid) macOS minutes for every PR commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and launch
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build package (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run unit and integration tests
        run: |
          set -o pipefail
          swift test --parallel 2>&1 | tee swift-test.log | tail -20 || {
            # Surface failing tests as annotations so they are readable without the raw log.
            grep -E "✘|error:|Expectation failed|failed after" swift-test.log | sort -u | head -40 \
              | while IFS= read -r line; do echo "::error::${line:0:900}"; done
            exit 1
          }

      - name: Install XcodeGen
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app and run UI tests
        run: |
          set -o pipefail
          xcodebuild \
            -project MacPulse.xcodeproj \
            -scheme MacPulse \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath build/UITests.xcresult \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            test 2>&1 | tee xcodebuild.log | grep -E "(warning|error):|Test Case|\*\* TEST" \
            || {
              echo "::error::xcodebuild test failed"
              # Surface the failing lines as annotations so they are readable without the raw log.
              grep -E "error:|failed|XCTAssert|Failing tests|Testing failed" xcodebuild.log \
                | grep -v "^Test Suite" | sort -u | head -40 \
                | while IFS= read -r line; do echo "::error::${line:0:900}"; done
              exit 1
            }
          test -d build/Build/Products/Debug/MacPulse.app

      - name: Smoke test — app launches and stays running
        run: |
          APP=build/Build/Products/Debug/MacPulse.app/Contents/MacOS/MacPulse
          "$APP" &
          PID=$!
          sleep 10
          if kill -0 "$PID" 2>/dev/null; then
            echo "MacPulse is running (pid $PID)"
            kill "$PID"
          else
            wait "$PID"; echo "MacPulse exited early with status $?"
            exit 1
          fi

      - name: Build Release configuration
        run: |
          set -o pipefail
          xcodebuild -project MacPulse.xcodeproj -scheme MacPulse -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build-release \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build 2>&1 | tee release.log | tail -5 \
            || { grep -E "error:" release.log | sort -u | head -20 | while IFS= read -r l; do echo "::error::${l:0:900}"; done; exit 1; }

      - name: Verify Release signing (no entitlements, Hardened Runtime)
        run: |
          codesign -d --entitlements - --xml build-release/Build/Products/Release/MacPulse.app > entitlements.plist
          # Checked on Release, the shipping artifact: Xcode adds debugging/preview
          # exceptions to Debug builds automatically. Anything new here needs an ADR first.
          python3 - <<'PY'
          import plistlib, sys
          with open("entitlements.plist", "rb") as f:
              data = f.read()
          entitlements = plistlib.loads(data) if data.strip() else {}
          print(f"::notice::Release entitlements: {entitlements}")
          allowed = {}  # ADR-010: no entitlements; any new one needs an ADR
          if entitlements != allowed:
              print(f"::error::Expected exactly {allowed}, got {entitlements}")
              sys.exit(1)
          PY
          codesign -dv --verbose=4 build-release/Build/Products/Release/MacPulse.app 2>&1 | tee codesign.txt
          grep -Eq "flags=.*runtime" codesign.txt || { echo "::error::Hardened Runtime is not enabled"; exit 1; }

      - name: Process-access probe (ADR-009/010) — must keep working
        run: |
          for config in Release Debug; do
            if [ "$config" = Release ]; then APP=build-release/Build/Products/Release/MacPulse.app; else APP=build/Build/Products/Debug/MacPulse.app; fi
            LINE=$(MACPULSE_DIAGNOSTICS=1 "$APP/Contents/MacOS/MacPulse" --macpulse-process-access-probe | grep '^MACPULSE_PROCESS_PROBE ')
            JSON=${LINE#MACPULSE_PROCESS_PROBE }
            echo "::notice title=Process probe ($config)::$JSON"
            echo "$JSON" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          ok = r["anyProcessRusage"]["succeeded"]
          sandboxed = r["isSandboxed"]
          if sandboxed or ok == 0:
              print("::error::Process monitoring regressed: sandboxed=%s, rusage ok=%s" % (sandboxed, ok))
              sys.exit(1)
          '
          done
          # Without the environment variable the probe must not run (normal launches).
          OUT=$(mktemp)
          build-release/Build/Products/Release/MacPulse.app/Contents/MacOS/MacPulse --macpulse-process-access-probe > "$OUT" 2>/dev/null &
          PID=$!
          sleep 5
          kill "$PID" 2>/dev/null || true
          if grep -q MACPULSE_PROCESS_PROBE "$OUT"; then
            echo "::error::Diagnostics ran without MACPULSE_DIAGNOSTICS=1"; exit 1
          fi

      - name: Monitoring overhead budget (Phase 3 acceptance)
        run: |
          LINE=$(MACPULSE_DIAGNOSTICS=1 build-release/Build/Products/Release/MacPulse.app/Contents/MacOS/MacPulse --macpulse-overhead-benchmark | grep '^MACPULSE_OVERHEAD ')
          JSON=${LINE#MACPULSE_OVERHEAD }
          echo "::notice title=Monitoring overhead (Release, CI VM)::$JSON"
          echo "$JSON" | python3 -c '
          import json, sys
          r = json.load(sys.stdin)
          ms = r["cpuMillisecondsPerSample"]
          # Budget: 15 ms CPU per sample = 0.025 % of one core at 60 s, 0.15 % at 10 s.
          if ms > 15:
              print("::error::Monitoring costs %.1f ms CPU per sample (budget 15 ms)" % ms)
              sys.exit(1)
          '

      - name: Guardrails — no networking, no process control (ADR-010)
        run: |
          # Source: APIs MacPulse must never use without a new ADR.
          if grep -RInE '\b(URLSession|NWConnection|NWListener|import Network|task_for_pid|kill\(|AuthorizationExecuteWithPrivileges|SMJobBless|NSAppleScript)' \
               --include='*.swift' App Domain Features Infrastructure Shared; then
            echo "::error::Forbidden API found in sources (see ADR-010)"; exit 1
          fi
          # Binary: no direct references to socket/process-control symbols.
          BIN=build-release/Build/Products/Release/MacPulse.app/Contents/MacOS/MacPulse
          if nm -u "$BIN" | grep -E '^_(socket|connect|task_for_pid|kill|ptrace)$'; then
            echo "::error::Forbidden symbol linked in the Release binary (see ADR-010)"; exit 1
          fi
          echo "Guardrails OK"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            xcodebuild.log
            build/UITests.xcresult
          if-no-files-found: ignore
